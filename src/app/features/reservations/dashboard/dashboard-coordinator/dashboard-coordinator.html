<h1 class="h3 mb-1">Dashboard</h1>
<p class="text-muted">Resumen de las solicitudes de tu carrera</p>

@if (isLoading()) {
  <p class="text-muted">Cargando...</p>
} @else {
  <div class="grid-kpi">
    @for (c of cards(); track c.label) {
      <div class="kpi">
        <div class="accentbar" [style.background]="c.accent"></div>
        <div class="kpi-inner">
          <div class="val">{{ c.value }}</div>
          <div class="lbl">{{ c.label }}</div>
        </div>
      </div>
    }
  </div>
}
