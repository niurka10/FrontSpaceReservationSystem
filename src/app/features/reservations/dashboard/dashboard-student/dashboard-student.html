<app-dashboard-greeting />

@if (isLoading()) {
<p class="state-msg">Cargando tus reservas...</p>
} @else if (loadError(); as msg) {
<div class="alert-error">{{ msg }}</div>
} @else {
<section class="section">
  <app-dashboard-kpis [reservations]="reservations()" />
</section>
<section class="section">
  <app-dashboard-upcoming [reservations]="reservations()" (voucher)="openVoucher($event)" />
</section>
<section class="section">
  <app-dashboard-week [reservations]="reservations()" />
</section>
<section class="section">
  <app-dashboard-activity />
</section>
}
@if (voucherId(); as id) {
<app-voucher-modal [reservationId]="id" (closed)="closeVoucher()" />
}
