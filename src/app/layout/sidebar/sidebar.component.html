<aside class="sidebar d-flex flex-column">

  <!-- LOGO -->
  <div class="brand d-flex align-items-center gap-2">

    <div class="mark"></div>

    <div class="word">
      UNIB·E
      <small>Reservas</small>
    </div>

  </div>

  <div class="navgroup-label">
    Menú
  </div>

  <nav class="nav flex-column flex-grow-1">

    <!-- DASHBOARD -->
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="navitem">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="9" rx="1.5" />
        <rect x="14" y="3" width="7" height="5" rx="1.5" />
        <rect x="14" y="12" width="7" height="9" rx="1.5" />
        <rect x="3" y="16" width="7" height="5" rx="1.5" />
      </svg>

      <span>Dashboard</span>

    </a>


    <!-- =========================
         ADMINISTRACIÓN
         ========================= -->

    <details class="nav-section">

      <summary class="section-title">

        <span class="section-left">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2l7 4v5c0 5-3 9-7 11-4-2-7-6-7-11V6l7-4Z" />
            <path d="M9 12l2 2 4-4" />
          </svg>

          <span>Administración</span>

        </span>

        <span class="chevron">⌄</span>

      </summary>

      <div class="submenu">

        <a routerLink="/users" routerLinkActive="active" class="navitem submenu-item">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>

          <span>Usuarios</span>

        </a>


        <a routerLink="/reservations" routerLinkActive="active" class="navitem submenu-item">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 6h13M8 12h13M8 18h13" />
            <path d="M3 6h.01M3 12h.01M3 18h.01" />
          </svg>

          <span>Reservas (todas)</span>

        </a>

      </div>

    </details>


    <!-- =========================
         CATÁLOGOS
         ========================= -->

    <details class="nav-section">

      <summary class="section-title">

        <span class="section-left">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" />
          </svg>

          <span>Catálogos</span>

        </span>

        <span class="chevron">⌄</span>

      </summary>

      <div class="submenu">

        <!-- FACULTADES -->
        <a routerLink="/faculties" routerLinkActive="active" class="navitem submenu-item">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="3" width="16" height="18" rx="1" />
            <path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1" />
          </svg>

          <span>Facultades</span>

        </a>


        <!-- CARRERAS -->
        <a routerLink="/careers" routerLinkActive="active" class="navitem submenu-item">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <path d="M3 10l9-5 9 5-9 5-9-5Z" />
            <path d="M7 12.5V17c2.5 2 7.5 2 10 0v-4.5" />
            <path d="M21 10v6" />

          </svg>

          <span>Carreras</span>

        </a>

      </div>

    </details>


    <!-- =========================
         RECURSOS
         ========================= -->

    <details class="nav-section">

      <summary class="section-title">

        <span class="section-left">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <path d="M21 8l-9-5-9 5v8l9 5 9-5V8Z" />
            <path d="M3.3 8.7 12 13l8.7-4.3" />
            <path d="M12 13v8" />

          </svg>

          <span>Recursos</span>

        </span>

        <span class="chevron">⌄</span>

      </summary>

      <div class="submenu">

        <!-- ESPACIOS Y RECURSOS -->
        <a routerLink="/spaces" routerLinkActive="active" class="navitem submenu-item">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 8l-9-5-9 5v8l9 5 9-5V8Z" />
            <path d="M3.3 8.7 12 13l8.7-4.3" />
            <path d="M12 13v8" />
          </svg>

          <span>Espacios</span>

        </a>

        <!-- RECURSOS -->

        <a routerLink="/resources" routerLinkActive="active" class="navitem submenu-item">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="7" width="18" height="13" rx="2" />
            <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>

          <span>Recursos</span>
        </a>

        <!--ALERTAS-->
        <a routerLink="/alerts" routerLinkActive="active" class="navitem submenu-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
            <path d="M10 21h4" />
          </svg>

          <span>Alertas</span>
        </a>


      </div>

    </details>


    <!--REPORTES-->

    <a routerLink="/reports" routerLinkActive="active" class="navitem main-item">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        <path d="M3 3v18h18" />
        <rect x="7" y="12" width="3" height="6" />
        <rect x="12" y="8" width="3" height="10" />
        <rect x="17" y="5" width="3" height="13" />

      </svg>

      <span>Reportes</span>

    </a>

  </nav>


  <!--USUARIO-->

  <div class="sidebar-foot">

    @if (authService.currentUser(); as user) {

    <div class="userchip">

      <div class="avatar">
        {{ initials(user.email) }}
      </div>

      <div>

        <div class="u-name text-truncate" style="max-width: 150px;">
          {{ user.email }}
        </div>

        <div class="u-role">
          {{ user.role }}
        </div>

      </div>

    </div>

    }

    <button class="logout-btn" (click)="authService.logout()">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <path d="M16 17l5-5-5-5" />
        <path d="M21 12H9" />

      </svg>

      Cerrar sesión

    </button>

  </div>

</aside>
